{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Pokedex App{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'pokedex/css/styles.css' %}">
</head>
<body>
    <header>
        <h2>PokeDex Central</h2>
        <nav>
            <a href="{% url 'home' %}">Pokemon</a>
            <a href="{% url 'lista_entrenadores' %}">Entrenadores</a>
            <a href="{% url 'lista_gyms' %}">Gimnasios</a>
            <a href="{% url 'lista_backups' %}">Cajas PC</a>
            <a href="/admin/" target="_blank">Panel Admin</a>
        </nav>
    </header>
    <main class="container">
        {% if messages %}
            <div class="messages-container">
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags }}">
                        {{ message }}
                    </div>
                {% endfor %}
            </div>
         {% endif %}
    {% block content %}{% endblock %}
    </main>
</body>
</html>
